<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>HoloShare – Pepper's Ghost</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, "SF Pro Display", sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    .container {
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #7f5cff, #4fc3ff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .btn {
      display: inline-block;
      margin: 12px 0;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 1rem;
      cursor: pointer;
    }

    #previewArea {
      margin-top: 10px;
      display: none;
    }

    #previewMedia {
      width: 90%;
      max-height: 40vh;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* ===== ホログラム表示（全画面） ===== */
    #holoScreen {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      justify-content: center;
      align-items: center;
      touch-action: none;
      z-index: 9999;
    }

    #holoMedia {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      transform: scaleX(-1); /* 左右反転（Pepper’s Ghost 必須） */
    }

    #closeBtn {
      position: fixed;
      top: env(safe-area-inset-top, 10px);
      right: 10px;
      padding: 8px 14px;
      font-size: 0.9rem;
      border-radius: 12px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      z-index: 10000;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>HoloShare – Pepper’s Ghost</h1>
    <p>写真・動画を読み込んで、ホログラム用にミラー反転して表示します。</p>

    <button class="btn" onclick="imageInput.click()">📸 写真を選ぶ</button>
    <button class="btn" onclick="videoInput.click()">🎥 動画を選ぶ</button>

    <input id="imageInput" type="file" accept="image/*" style="display:none">
    <input id="videoInput" type="file" accept="video/*" style="display:none">

    <div id="previewArea">
      <p>プレビュー</p>
      <img id="previewMedia" />
      <video id="previewMedia" playsinline controls style="display:none"></video>
      <br>
      <button class="btn" id="startBtn">✨ ホログラム表示</button>
    </div>
  </div>

  <!-- ホログラム本番画面 -->
  <div id="holoScreen">
    <button id="closeBtn">✕</button>
    <video id="holoMedia" playsinline loop muted style="display:none"></video>
    <img id="holoMedia" style="display:none">
  </div>

<script>
  const imageInput = document.getElementById("imageInput");
  const videoInput = document.getElementById("videoInput");
  const previewArea = document.getElementById("previewArea");
  const previewMediaImg = document.querySelector("#previewArea img");
  const previewMediaVid = document.querySelector("#previewArea video");
  const startBtn = document.getElementById("startBtn");

  const holoScreen = document.getElementById("holoScreen");
  const closeBtn = document.getElementById("closeBtn");
  const holoMedia = document.querySelector("#holoScreen video");

  let currentType = null;
  let currentSrc = null;

  // 画像
  imageInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    currentType = "image";
    const reader = new FileReader();
    reader.onload = ev => {
      currentSrc = ev.target.result;

      previewArea.style.display = "block";
      previewMediaVid.style.display = "none";
      previewMediaImg.style.display = "block";
      previewMediaImg.src = currentSrc;
    };
    reader.readAsDataURL(file);
  });

  // 動画
  videoInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    currentType = "video";
    const url = URL.createObjectURL(file);

    currentSrc = url;

    previewArea.style.display = "block";
    previewMediaImg.style.display = "none";
    previewMediaVid.style.display = "block";
    previewMediaVid.src = url;
    previewMediaVid.play();
  });

  startBtn.addEventListener("click", () => {
    holoScreen.style.display = "flex";

    if (currentType === "image") {
      const img = document.createElement("img");
      img.id = "holoImg";
      img.src = currentSrc;
      img.style.width = "100vw";
      img.style.height = "100vh";
      img.style.objectFit = "contain";
      img.style.transform = "scaleX(-1)";
      holoScreen.appendChild(img);
    }

    if (currentType === "video") {
      holoMedia.src = currentSrc;
      holoMedia.style.display = "block";
      holoMedia.play();
    }

    // フルスクリーン試行
    try {
      let el = holoScreen;
      if (el.requestFullscreen) el.requestFullscreen();
    } catch (e) {}
  });

  closeBtn.addEventListener("click", () => {
    holoScreen.style.display = "none";
    holoMedia.pause();
  });
</script>

</body>
</html>
