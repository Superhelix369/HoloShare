<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>HoloShare｜ホログラム4面プレーヤー</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  /* ===== タイトル ===== */
  #appTitle {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 4px);
    width: 100%;
    text-align: center;
    font-size: 32px;
    font-weight: 600;
    background: linear-gradient(90deg, #b3e5ff, #ffffff, #b3e5ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 10px rgba(120,200,255,0.7);
    z-index: 2000;
    pointer-events: none;
  }

  /* ===== ボタンパネル ===== */
  #controls {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 60px);
    width: 100%;
    text-align: center;
    z-index: 1500;
  }

  label, button {
    background: #222;
    color: #fff;
    padding: 10px 14px;
    border: 1px solid #555;
    border-radius: 8px;
    margin: 5px;
    font-size: 14px;
  }

  input[type=file] { display: none; }

  /* ===== キャンバス表示領域 ===== */
  #canvasWrapper {
    position: fixed;
    inset: 0;          /* ←これで上下左右全部いっぱい */
    background: #000;
    z-index: 1;
  }

  canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;  /* ←絶対に切れない */
    display: block;
  }
</style>
</head>

<body>

<div id="appTitle">HoloShare</div>

<div id="controls">
  <label for="videoInput">🎬 動画ファイルを選択</label>
  <input id="videoInput" type="file" accept="video/*">
  <button id="playBtn" disabled>▶再生/一時停止</button>
  <button id="fsBtn" disabled>⛶ 全画面</button>
</div>

<div id="canvasWrapper">
  <canvas id="holoCanvas"></canvas>
</div>

<video id="srcVideo" playsinline webkit-playsinline style="display:none;"></video>

<script>
/* ===== 設定 ===== */
const CANVAS_SIZE = 1080;      // iPhone 14 → 本番では1000に切替
const CROP_SCALE  = 0.80;      // 正方形の中心トリミング
const FACE_SCALE  = 0.36;      // 1面サイズ（切れないギリギリ）

/* ================= */
const canvas = document.getElementById("holoCanvas");
const ctx = canvas.getContext("2d");
canvas.width  = CANVAS_SIZE;
canvas.height = CANVAS_SIZE;

const videoInput = document.getElementById("videoInput");
const video = document.getElementById("srcVideo");
const playBtn = document.getElementById("playBtn");
const fsBtn   = document.getElementById("fsBtn");

const controls = document.getElementById("controls");
const appTitle = document.getElementById("appTitle");

let isLoaded = false;
let isFull   = false;
let animId   = null;

/* メタデータ待ち */
function waitVideoReady(){
  return new Promise((resolve)=>{
    if(video.readyState>=2) resolve();
    else video.addEventListener("loadedmetadata",resolve,{once:true});
  });
}

/* ファイル選択 */
videoInput.addEventListener("change", async(e)=>{
  const file = e.target.files[0];
  if(!file) return;

  video.src = URL.createObjectURL(file);
  video.load();

  await waitVideoReady();
  isLoaded = true;

  video.loop = true;  // ←←★ 自動ループ再生！
  video.play();

  playBtn.disabled = false;
  fsBtn.disabled   = false;

  startLoop();
});

/* 再生停止 */
playBtn.addEventListener("click",()=>{
  if(video.paused){
    video.play();
    playBtn.textContent="⏸一時停止";
  } else {
    video.pause();
    playBtn.textContent="▶再生";
  }
});

/* 全画面 (UIを消すだけ) */
fsBtn.addEventListener("click",()=>{
  if(!isFull){
    controls.style.display="none";
    appTitle.style.display="none";
    isFull=true;
  }else{
    controls.style.display="";
    appTitle.style.display="";
    isFull=false;
  }
});

/* ループ開始 */
function startLoop(){
  if(animId!=null) return;
  const loop=()=>{
    drawHologram();
    animId=requestAnimationFrame(loop);
  };
  animId=requestAnimationFrame(loop);
}

/* ===== 4面描画 ===== */
function drawHologram(){
  if(!isLoaded) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if(!vw || !vh) return;

  const shortSide = Math.min(vw,vh);
  const cropSize  = shortSide*CROP_SCALE;
  const sx=(vw-cropSize)/2;
  const sy=(vh-cropSize)/2;

  const S = CANVAS_SIZE;
  const face = S*FACE_SCALE;
  const cx=S/2, cy=S/2;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="black";
  ctx.fillRect(0,0,S,S);

  function f(angle,x,y){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);
    ctx.drawImage(video,sx,sy,cropSize,cropSize,-face/2,-face/2,face,face);
    ctx.restore();
  }

  f(0,          cx, cy+face/2);
  f(Math.PI,    cx, cy-face/2);
  f(-Math.PI/2, cx-face/2, cy);
  f(Math.PI/2,  cx+face/2, cy);
}
</script>

</body>
</html>
