<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>HoloShare｜ホログラム4面プレーヤー</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    width: 100%;
    overflow: hidden;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
  }

 #appTitle {
  position: fixed;
  top: calc(env(safe-area-inset-top) + 8px);
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 34px;
  font-weight: 600;
  font-family: "Segoe UI", "Hiragino Sans", "Helvetica Neue", sans-serif;
  background: linear-gradient(90deg, #b3e5ff, #ffffff, #b3e5ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow:
    0 0 8px rgba(100,180,255,0.7),
    0 0 12px rgba(150,220,255,0.5);
  z-index: 2000;
  pointer-events: none;
}

#controls {
  position: fixed;
  top: calc(env(safe-area-inset-top) + 70px);
  left: 0;
  width: 100%;
  text-align: center;
  z-index: 1500;
}

#canvasWrapper {
    position: absolute;
    top: 110px;
    left: 0;
    right: 0;
    bottom: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
}

canvas {
  display: block;
  background: #000;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

label, button {
  background: #222;
  color: #fff;
  padding: 10px 14px;
  border: 1px solid #555;
  border-radius: 8px;
  margin: 5px 6px;
  font-size: 14px;
}

input[type=file] {
  display: none;
}
</style>
</head>
<body>

<div id="appTitle">HoloShare</div>

<div id="controls">
  <label for="videoInput">🎬 動画ファイルを選択</label>
  <input id="videoInput" type="file" accept="video/*">
  <button id="playBtn" disabled>▶再生/一時停止</button>
  <button id="fsBtn" disabled>⛶ 全画面</button>
</div>

<div id="canvasWrapper">
  <canvas id="holoCanvas"></canvas>
</div>

<video id="srcVideo" playsinline webkit-playsinline style="display:none;"></video>

<script>
/* ===== 設定 ===== */

// iPhone 14（開発）
const CANVAS_SIZE_IPHONE14 = 1080;
// iPhone X（本番）
const CANVAS_SIZE_IPHONEX = 1000;

// ▼ 使用するキャンバスサイズ（切り替え）
const CANVAS_SIZE = CANVAS_SIZE_IPHONE14;
// const CANVAS_SIZE = CANVAS_SIZE_IPHONEX;

// ▼ ピラミッド 13cm 最適化
const CROP_SCALE = 0.80; 
const FACE_SCALE = 0.38;  // ←ここを上げると人物が大きくなる（0.38〜0.44）推奨

/* =============================== */

const canvas = document.getElementById("holoCanvas");
const ctx = canvas.getContext("2d");
canvas.width  = CANVAS_SIZE;
canvas.height = CANVAS_SIZE;

const video = document.getElementById("srcVideo");
video.loop = true;  // 🔥 無限ループ追加

const videoInput = document.getElementById("videoInput");
const playBtn = document.getElementById("playBtn");
const fsBtn   = document.getElementById("fsBtn");

const controls = document.getElementById("controls");
const wrapper  = document.getElementById("canvasWrapper");
const title    = document.getElementById("appTitle");

let isLoaded = false;
let animId = null;
let isFull = false;

function waitVideoReady() {
  return new Promise((resolve)=>{
    if (video.readyState >= 2) resolve();
    else video.addEventListener("loadedmetadata", resolve, {once:true});
  });
}

videoInput.addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  if (!file) return;

  video.src = URL.createObjectURL(file);
  video.load();

  await waitVideoReady();
  isLoaded = true;

  playBtn.disabled = false;
  fsBtn.disabled   = false;

  video.play();
  startLoop();
});

playBtn.addEventListener("click", ()=>{
  if (!isLoaded) return;

  if (video.paused) {
    video.play();
    playBtn.textContent = "⏸一時停止";
    startLoop();
  } else {
    video.pause();
    playBtn.textContent = "▶再生";
    stopLoop();
  }
});

/* 全画面（UI非表示） */
fsBtn.addEventListener("click", ()=>{
  if (!isFull) {
    controls.style.display = "none";
    title.style.display    = "none";
    wrapper.style.top      = "0";
    isFull = true;
  } else {
    controls.style.display = "";
    title.style.display    = "";
    wrapper.style.top      = "110px";
    isFull = false;
  }
});

/* ==== アニメーションループ ==== */
function startLoop() {
  if (animId != null) return;
  const loop = ()=>{
    drawHologram();
    animId = requestAnimationFrame(loop);
  };
  animId = requestAnimationFrame(loop);
}

function stopLoop() {
  cancelAnimationFrame(animId);
  animId = null;
}

/* ==== 4面ホログラム描画 ==== */
function drawHologram() {
  if (!isLoaded) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) return;

  const shortSide = Math.min(vw, vh);
  const crop = shortSide * CROP_SCALE;
  const sx = (vw - crop) / 2;
  const sy = (vh - crop) / 2;

  const S = CANVAS_SIZE;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,S,S);

  const face = S * FACE_SCALE;
  const cx = S/2;
  const cy = S/2;

  function drawFace(rot, tx, ty) {
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(rot);
    ctx.drawImage(video, sx, sy, crop, crop, -face/2, -face/2, face, face);
    ctx.restore();
  }

  drawFace(0,          cx,           cy + face/2);
  drawFace(Math.PI,    cx,           cy - face/2);
  drawFace(-Math.PI/2, cx - face/2,  cy);
  drawFace(Math.PI/2,  cx + face/2,  cy);
}
</script>
</body>
</html>
