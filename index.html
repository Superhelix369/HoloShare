<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>HoloShare – Pyramid 3D Hologram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      overflow: hidden;
      font-family: -apple-system, "SF Pro Display", sans-serif;
      touch-action: none;
    }

    .container {
      padding: 20px;
      text-align: center;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      margin: 10px;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.3);
      cursor: pointer;
    }

    /* === ホログラム画面 === */
    #holoScreen {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #closeBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      padding: 8px 14px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      z-index: 10000;
    }

    /* ★ 4面ピラミッド用のホログラム表示 ★ */
    #pyramidCanvas {
      width: 100vw;
      height: 100vh;
      position: relative;
      transform-origin: center;
    }

    /* 4つの面（上・左・右・下） */
    .face {
      position: absolute;
      width: 50vw;
      height: 50vh;
      object-fit: contain;
      filter: brightness(140%) contrast(130%);
    }

    #topFace   { top:   0; left: 25vw; }
    #leftFace  { top: 25vh; left:  0; transform: scaleX(-1); }
    #rightFace { top: 25vh; right: 0; transform: scaleX(1); }
    #bottomFace{ bottom: 0; left: 25vw; transform: rotate(180deg); }

    /* 操作スライダー */
    .controls {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      z-index: 20000;
    }

    .slider {
      width: 70%;
      margin: 12px auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>HoloShare – 3D Pyramid Hologram</h1>
    <p>動画・写真を4方向に配置し、逆ピラミッド3Dホログラムで表示します。</p>

    <button class="btn" onclick="imageInput.click()">📸 画像を選択</button>
    <button class="btn" onclick="videoInput.click()">🎥 動画を選択</button>

    <input id="imageInput" type="file" accept="image/*" style="display:none">
    <input id="videoInput" type="file" accept="video/*" style="display:none">

    <div id="previewArea" style="display:none;">
      <p>プレビュー</p>
      <img id="previewImg" style="width:80%; display:none;">
      <video id="previewVid" playsinline controls style="width:80%; display:none;"></video>
      <button class="btn" id="startBtn">✨ 3Dホログラム表示</button>
    </div>
  </div>

  <!-- === ホログラム本画面 === -->
  <div id="holoScreen">
    <button id="closeBtn">✕</button>

    <div id="pyramidCanvas">
      <img id="topFace" class="face">
      <img id="leftFace" class="face">
      <img id="rightFace" class="face">
      <img id="bottomFace" class="face">
    </div>

    <!-- 調整UI -->
    <div class="controls">
      大きさ
      <input id="scaleSlider" type="range" min="50" max="200" value="100" class="slider">
      明るさ
      <input id="brightSlider" type="range" min="50" max="250" value="140" class="slider">
      上下位置
      <input id="ySlider" type="range" min="-50" max="50" value="0" class="slider">
    </div>
  </div>

<script>
  const imgInput = document.getElementById("imageInput");
  const vidInput = document.getElementById("videoInput");

  const previewArea = document.getElementById("previewArea");
  const previewImg = document.getElementById("previewImg");
  const previewVid = document.getElementById("previewVid");

  let currentSrc = null;
  let mediaType = null;

  imgInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    mediaType = "image";
    const reader = new FileReader();
    reader.onload = ev => {
      currentSrc = ev.target.result;
      previewArea.style.display = "block";
      previewVid.style.display = "none";
      previewImg.style.display = "block";
      previewImg.src = currentSrc;
    };
    reader.readAsDataURL(file);
  });

  vidInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    mediaType = "video";
    currentSrc = URL.createObjectURL(file);
    previewArea.style.display = "block";
    previewImg.style.display = "none";
    previewVid.style.display = "block";
    previewVid.src = currentSrc;
    previewVid.play();
  });

  document.getElementById("startBtn").addEventListener("click", () => {
    document.getElementById("holoScreen").style.display = "flex";

    document.querySelectorAll(".face").forEach(face => {
      face.src = currentSrc;
    });

    try {
      document.getElementById("holoScreen").requestFullscreen();
    } catch(e){}
  });

  document.getElementById("closeBtn").addEventListener("click", () => {
    document.getElementById("holoScreen").style.display = "none";
  });

  // ★ スライダー制御 ★
  const canvas = document.getElementById("pyramidCanvas");

  document.getElementById("scaleSlider").oninput = e => {
    const v = e.target.value / 100;
    canvas.style.transform = `scale(${v})`;
  };

  document.getElementById("brightSlider").oninput = e => {
    const v = e.target.value;
    document.querySelectorAll(".face").forEach(face => {
      face.style.filter = `brightness(${v}%) contrast(150%)`;
    });
  };

  document.getElementById("ySlider").oninput = e => {
    const v = e.target.value;
    canvas.style.marginTop = `${v}px`;
  };
</script>

</body>
</html>
