<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>HoloShare｜ホログラム4面プレーヤー</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    width: 100%;
    overflow: hidden;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
  }

  #controls {
    text-align: center;
    padding: 12px;
    background: #000;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;   /* 最前面 */
}

#canvasWrapper {
    position: absolute;
    top: 60px;        /* controls 分の余白 */
    left: 0;
    right: 0;
    bottom: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
}

  canvas {
    display: block;
    background: #000;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  label, button {
    background: #222;
    color: #fff;
    padding: 10px 14px;
    border: 1px solid #555;
    border-radius: 8px;
    margin: 5px 0;
    font-size: 14px;
  }

  input[type=file] {
    display: none;
  }
</style>
</head>
<body>

<div id="controls">
  <label for="videoInput">🎬 動画ファイルを選択</label>
  <input id="videoInput" type="file" accept="video/*">
  <button id="playBtn" disabled>▶再生/一時停止</button>
  <button id="fsBtn" disabled>⛶ 全画面</button>
</div>

<div id="canvasWrapper">
  <canvas id="holoCanvas"></canvas>
</div>

<video id="srcVideo" playsinline webkit-playsinline style="display:none;"></video>

<script>
/* ===== 設定 ===== */

// iPhone 14（開発用）
const CANVAS_SIZE_IPHONE14 = 1080;

// iPhone X（本番用）
const CANVAS_SIZE_IPHONEX = 1000;

// ★使うキャンバスサイズ（コメント切替）★
const CANVAS_SIZE = CANVAS_SIZE_IPHONE14;
// const CANVAS_SIZE = CANVAS_SIZE_IPHONEX;

// プラバンピラミッド（上13cm/下4cm/高さ8cm）に合わせた人物大きさ調整
const CROP_SCALE = 0.80;    // 中央のズーム量
const FACE_SCALE = 0.42;    // 1面の大きさ（0.40〜0.46で微調整可）

/* =============================== */

const canvas = document.getElementById("holoCanvas");
const ctx = canvas.getContext("2d");
canvas.width = CANVAS_SIZE;
canvas.height = CANVAS_SIZE;

const videoInput = document.getElementById("videoInput");
const video = document.getElementById("srcVideo");
const playBtn = document.getElementById("playBtn");
const fsBtn = document.getElementById("fsBtn");

let isLoaded = false;
let animId = null;

/* iPhone/iOS 対策：動画のメタデータが即取れない場合があるため
   専用のロード処理を追加 */
function waitVideoReady() {
  return new Promise((resolve) => {
    if (video.readyState >= 2) {
      resolve();
    } else {
      video.addEventListener("loadedmetadata", resolve, { once: true });
    }
  });
}

/* ファイル選択 */
videoInput.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  video.src = URL.createObjectURL(file);
  video.load();

  await waitVideoReady();
  isLoaded = true;

  playBtn.disabled = false;
  fsBtn.disabled = false;

  video.play();
  startLoop();
});

/* 再生/停止 */
playBtn.addEventListener("click", () => {
  if (!isLoaded) return;

  if (video.paused) {
    video.play();
    startLoop();
  } else {
    video.pause();
    stopLoop();
  }
});

/* 全画面 */
fsBtn.addEventListener("click", () => {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
});

/* ループ描画 */
function startLoop() {
  if (animId != null) return;
  const loop = () => {
    drawHologram();
    animId = requestAnimationFrame(loop);
  };
  animId = requestAnimationFrame(loop);
}

function stopLoop() {
  cancelAnimationFrame(animId);
  animId = null;
}

/* ===== 4面ホログラム描画 ===== */
function drawHologram() {
  if (!isLoaded) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (vw === 0 || vh === 0) return;

  const shortSide = Math.min(vw, vh);
  const cropSize = shortSide * CROP_SCALE;

  const sx = (vw - cropSize) / 2;
  const sy = (vh - cropSize) / 2;

  const S = CANVAS_SIZE;
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, S, S);

  const face = S * FACE_SCALE;
  const cx = S / 2;
  const cy = S / 2;

  /* 下（観客側） */
  ctx.save();
  ctx.translate(cx, cy + face / 2);
  ctx.drawImage(video, sx, sy, cropSize, cropSize,
                -face / 2, -face, face, face);
  ctx.restore();

  /* 上：180度回転 */
  ctx.save();
  ctx.translate(cx, cy - face / 2);
  ctx.rotate(Math.PI);
  ctx.drawImage(video, sx, sy, cropSize, cropSize,
                -face / 2, -face, face, face);
  ctx.restore();

  /* 左：-90度 */
  ctx.save();
  ctx.translate(cx - face / 2, cy);
  ctx.rotate(-Math.PI / 2);
  ctx.drawImage(video, sx, sy, cropSize, cropSize,
                -face / 2, -face, face, face);
  ctx.restore();

  /* 右：+90度 */
  ctx.save();
  ctx.translate(cx + face / 2, cy);
  ctx.rotate(Math.PI / 2);
  ctx.drawImage(video, sx, sy, cropSize, cropSize,
                -face / 2, -face, face, face);
  ctx.restore();
}
</script>

</body>
</html>
