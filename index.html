<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>HoloShare<p>
    ホログラム用4面動画プレーヤー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    header {
      padding: 10px 12px;
      text-align: center;
      font-size: 14px;
      opacity: 0.85;
    }

    #controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 12px 10px;
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
    }

    button, label {
      background: #222;
      color: #fff;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      text-align: center;
    }

    button:active {
      background: #444;
    }

    input[type="file"] {
      display: none;
    }

    #canvasWrapper {
      width: 100vw;
      max-width: 100vh; /* 画面よりはみ出さないように */
      aspect-ratio: 1 / 1; /* 正方形を維持 */
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
    }

    canvas {
      width: 100%;
      height: 100%;
      background: #000;
      display: block;
    }

    small {
      font-size: 11px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <header>
    <div>スマホ用ホログラム4面プレーヤー</div>
    <small>動画を選んで「再生 → 全画面」にしてから装置にセット</small>
  </header>

  <section id="controls">
    <label for="videoInput">🎬 動画ファイルを選択（mp4 など）</label>
    <input type="file" id="videoInput" accept="video/*">

    <button id="playBtn" disabled>▶ 再生 / 一時停止</button>
    <button id="fsBtn" disabled>⛶ 全画面表示</button>

    <small>
      ※iPhone 14 と iPhone X のキャンバス解像度は、<br>
      下のコード内の <code>CANVAS_SIZE</code> をコメント切り替えしてください。
    </small>
  </section>

  <div id="canvasWrapper">
    <canvas id="holoCanvas"></canvas>
  </div>

  <!-- 非表示のvideo（ソースとしてだけ使う） -->
  <video id="srcVideo" playsinline webkit-playsinline style="display:none;"></video>

  <script>
    // ====== 設定 ======
    // ★ iPhone 14 用 推奨設定（開発・テスト用）
    const CANVAS_SIZE_IPHONE_14 = 1080;

    // ★ iPhone X 用 推奨設定（本番用）
    const CANVAS_SIZE_IPHONE_X = 1000;

    // ↓ 実際に使うサイズをここで選択（必要に応じて切り替えてください）
    // const CANVAS_SIZE = CANVAS_SIZE_IPHONE_14; // ← 開発中（iPhone 14 のとき）
    const CANVAS_SIZE = CANVAS_SIZE_IPHONE_X;   // ← 本番（iPhone X のとき）

    // 人物の拡大率（0.0〜1.0くらいで調整）
    // 1.0 に近いほど、大きく表示される（はみ出す場合は下げる）
    const CROP_SCALE = 0.9;

    const videoInput = document.getElementById('videoInput');
    const video = document.getElementById('srcVideo');
    const canvas = document.getElementById('holoCanvas');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('playBtn');
    const fsBtn   = document.getElementById('fsBtn');

    let animId = null;
    let isLoaded = false;

    canvas.width  = CANVAS_SIZE;
    canvas.height = CANVAS_SIZE;

    // ====== ファイル選択 ======
    videoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      video.src = url;
      video.load();

      video.addEventListener('loadedmetadata', onLoadedMeta, { once: true });
    });

    function onLoadedMeta() {
      isLoaded = true;
      playBtn.disabled = false;
      fsBtn.disabled = false;

      // 自動で再生開始
      video.play().catch(() => {
        // 自動再生がブロックされた場合は無視
      });

      startLoop();
    }

    // ====== 再生 / 一時停止 ======
    playBtn.addEventListener('click', () => {
      if (!isLoaded) return;

      if (video.paused) {
        video.play();
        playBtn.textContent = '⏸ 一時停止';
        startLoop();
      } else {
        video.pause();
        playBtn.textContent = '▶ 再生';
        stopLoop();
      }
    });

    // ====== 全画面表示 ======
    fsBtn.addEventListener('click', () => {
      const wrapper = document.getElementById('canvasWrapper');
      if (wrapper.requestFullscreen) {
        wrapper.requestFullscreen();
      } else if (wrapper.webkitRequestFullscreen) { // iOS Safari
        wrapper.webkitRequestFullscreen();
      }
    });

    // ====== アニメーションループ ======
    function startLoop() {
      if (animId != null) return;
      const loop = () => {
        drawHologram();
        animId = requestAnimationFrame(loop);
      };
      animId = requestAnimationFrame(loop);
    }

    function stopLoop() {
      if (animId != null) {
        cancelAnimationFrame(animId);
        animId = null;
      }
    }

    // ====== 4面ホログラム描画 ======
    function drawHologram() {
      if (!isLoaded) return;
      if (video.readyState < 2) return; // データがまだ

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      if (vw === 0 || vh === 0) return;

      // まず、元動画の中央を正方形でトリミング
      const shortSide = Math.min(vw, vh);
      const cropSize = shortSide * CROP_SCALE; // ちょっとズームイン
      const sx = (vw - cropSize) / 2;
      const sy = (vh - cropSize) / 2;
      const sw = cropSize;
      const sh = cropSize;

      const S = CANVAS_SIZE;
      ctx.clearRect(0, 0, S, S);
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, S, S);

      // 1面あたりの表示サイズ（正方形）
      const faceSize = S * 0.45; // 0.45〜0.48くらいまで上げてもOK
      const cx = S / 2;
      const cy = S / 2;

      // ===== 底（観客側） =====
      ctx.save();
      ctx.translate(cx, cy + faceSize / 2);
      // 回転なし（上下もそのまま）
      ctx.drawImage(
        video,
        sx, sy, sw, sh,
        -faceSize / 2, -faceSize, faceSize, faceSize
      );
      ctx.restore();

      // ===== 上（ピラミッドの上側） → 180度回転 =====
      ctx.save();
      ctx.translate(cx, cy - faceSize / 2);
      ctx.rotate(Math.PI); // 180度回転
      ctx.drawImage(
        video,
        sx, sy, sw, sh,
        -faceSize / 2, -faceSize, faceSize, faceSize
      );
      ctx.restore();

      // ===== 左側 → -90度回転 =====
      ctx.save();
      ctx.translate(cx - faceSize / 2, cy);
      ctx.rotate(-Math.PI / 2);
      ctx.drawImage(
        video,
        sx, sy, sw, sh,
        -faceSize / 2, -faceSize, faceSize, faceSize
      );
      ctx.restore();

      // ===== 右側 → +90度回転 =====
      ctx.save();
      ctx.translate(cx + faceSize / 2, cy);
      ctx.rotate(Math.PI / 2);
      ctx.drawImage(
        video,
        sx, sy, sw, sh,
        -faceSize / 2, -faceSize, faceSize, faceSize
      );
      ctx.restore();
    }
  </script>
</body>
</html>
