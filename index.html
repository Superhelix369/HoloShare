<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>HoloShare｜ホログラム4面プレーヤー</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    width: 100%;
    overflow: hidden;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
  }

 #appTitle {
  position: fixed;
  top: calc(env(safe-area-inset-top) + 8px);
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 34px;
  font-weight: 600;
  font-family: "Segoe UI", "Hiragino Sans", "Helvetica Neue", sans-serif;
  background: linear-gradient(90deg, #b3e5ff, #ffffff, #b3e5ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow:
    0 0 8px rgba(100,180,255,0.7),
    0 0 12px rgba(150,220,255,0.5);
  z-index: 2000;
  pointer-events: none;
}

#controls {
  position: fixed;
  top: calc(env(safe-area-inset-top) + 70px);
  left: 0;
  width: 100%;
  z-index: 1500;
}


  

#canvasWrapper {
    position: absolute;
    top: 100px;        /* controls 分の余白 */
    left: 0;
    right: 0;
    bottom: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
}

  canvas {
    display: block;
    background: #000;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  label, button {
    background: #222;
    color: #fff;
    padding: 10px 14px;
    border: 1px solid #555;
    border-radius: 8px;
    margin: 5px 0;
    font-size: 14px;
  }

  input[type=file] {
    display: none;
  }
</style>
</head>
<body>
  
<div id="appTitle">HoloShare</div>  
  
<div id="controls">
  <label for="videoInput">🎬 動画ファイルを選択</label>
  <input id="videoInput" type="file" accept="video/*">
  <button id="playBtn" disabled>▶再生/一時停止</button>
  <button id="fsBtn" disabled>⛶ 全画面</button>
</div>

<div id="canvasWrapper">
  <canvas id="holoCanvas"></canvas>
</div>

<video id="srcVideo" playsinline webkit-playsinline style="display:none;"></video>

<script>
/* ===== 設定 ===== */

// iPhone 14（開発用）
const CANVAS_SIZE_IPHONE14 = 1080;

// iPhone X（本番用）
const CANVAS_SIZE_IPHONEX = 1000;

// ★使うキャンバスサイズ（コメント切り替え）★
const CANVAS_SIZE = CANVAS_SIZE_IPHONE14;
// const CANVAS_SIZE = CANVAS_SIZE_IPHONEX;

// プラバンピラミッド（上13cm/下4cm/高さ8cm）に合わせた人物大きさ調整
const CROP_SCALE = 0.80;    // 中央のズーム量（0.7〜0.9で微調整可）
const FACE_SCALE = 0.35;    // 1面の大きさ（0.30〜0.45で微調整可）

/* =============================== */

const canvas = document.getElementById("holoCanvas");
const ctx = canvas.getContext("2d");
canvas.width = CANVAS_SIZE;
canvas.height = CANVAS_SIZE;

const videoInput = document.getElementById("videoInput");
const video = document.getElementById("srcVideo");
const playBtn = document.getElementById("playBtn");
const fsBtn   = document.getElementById("fsBtn");

const wrapper  = document.getElementById("canvasWrapper");
const controls = document.getElementById("controls");
const appTitle = document.getElementById("appTitle");

let isLoaded = false;
let animId   = null;
let isFull   = false;

/* iPhone/iOS 対策：動画メタデータの取得 */
function waitVideoReady() {
  return new Promise((resolve) => {
    if (video.readyState >= 2) {
      resolve();
    } else {
      video.addEventListener("loadedmetadata", resolve, { once: true });
    }
  });
}

/* ファイル選択 */
videoInput.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  video.src = URL.createObjectURL(file);
  video.load();

  await waitVideoReady();
  isLoaded = true;

  playBtn.disabled = false;
  fsBtn.disabled   = false;

  video.play().catch(() => {});
  startLoop();
});

/* 再生/停止 */
playBtn.addEventListener("click", () => {
  if (!isLoaded) return;

  if (video.paused) {
    video.play();
    startLoop();
    playBtn.textContent = "⏸一時停止";
  } else {
    video.pause();
    stopLoop();
    playBtn.textContent = "▶再生";
  }
});

/* 「全画面」ボタン：ブラウザのフルスクリーンは使わず、UIを隠してキャンバスを全面表示する */
fsBtn.addEventListener("click", () => {
  if (!isFull) {
    if (controls) controls.style.display = "none";
    if (appTitle) appTitle.style.display = "none";
    if (wrapper)  wrapper.style.top = "0";
    isFull = true;
  } else {
    if (controls) controls.style.display = "";
    if (appTitle) appTitle.style.display = "";
    if (wrapper)  wrapper.style.top = "";  // CSS の値に戻す
    isFull = false;
  }
});

/* ループ描画 */
function startLoop() {
  if (animId != null) return;
  const loop = () => {
    drawHologram();
    animId = requestAnimationFrame(loop);
  };
  animId = requestAnimationFrame(loop);
}

function stopLoop() {
  if (animId != null) {
    cancelAnimationFrame(animId);
    animId = null;
  }
}

/* ===== 4面ホログラム描画 ===== */
function drawHologram() {
  if (!isLoaded) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) return;

  // 縦動画でも横動画でも、中央の正方形を切り出す
  const shortSide = Math.min(vw, vh);
  const cropSize  = shortSide * CROP_SCALE;
  const sx = (vw - cropSize) / 2;
  const sy = (vh - cropSize) / 2;

  const S = CANVAS_SIZE;

  // 変換をリセットして、毎フレームまっさらな状態から描画
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, S, S);

  const face = S * FACE_SCALE; // 1面の一辺の長さ（正方形）
  const cx = S / 2;
  const cy = S / 2;

  // 1面描画用の小さなヘルパー
  function drawFace(angleRad, tx, ty) {
    ctx.save();
    ctx.translate(tx, ty);       // この座標を中心として
    ctx.rotate(angleRad);        // 回転
    ctx.drawImage(
      video,
      sx, sy, cropSize, cropSize,   // 元動画（中央の正方形）
      -face / 2, -face / 2,         // 描画先の左上（中心から半分ずらす）
      face, face                    // 描画先サイズ（正方形）
    );
    ctx.restore();
  }

  // 下（観客側）: 回転なし
  drawFace(0,            cx,             cy + face / 2);

  // 上 : 180度回転
  drawFace(Math.PI,      cx,             cy - face / 2);

  // 左 : -90度回転
  drawFace(-Math.PI/2,   cx - face / 2,  cy);

  // 右 : +90度回転
  drawFace(Math.PI/2,    cx + face / 2,  cy);
}
</script>


</body>
</html>
